<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Railo</title>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--muted:#6e6e73;--field:#f5f5f7;--line:#e3e3e6;--accent:#1d1d1f;--accent-fg:#fff;--red:#d93025}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f10;--fg:#f2f2f2;--muted:#9a9aa0;--field:#1a1a1c;--line:#2a2a2d;--accent:#f2f2f2;--accent-fg:#0f0f10;--red:#ff6b5e}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
main{width:min(340px,100%);text-align:center;opacity:0;transition:opacity .2s}
main.show{opacity:1}
h1{font-weight:600;letter-spacing:.02em;font-size:2.4rem;margin:0}
p{color:var(--muted);margin:8px 0 28px}
form{display:flex;flex-direction:column;gap:10px}
input{font:inherit;color:var(--fg);background:var(--field);border:1px solid transparent;border-radius:12px;padding:13px 14px;width:100%;outline:none;text-align:center}
input:focus{border-color:var(--line);background:var(--bg)}
button{font:inherit;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-fg);border:0;border-radius:12px;padding:13px}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--red);font-size:.9rem;min-height:1.3em;margin:4px 0 0}
</style>
</head>
<body>
<main id="gate">
  <h1>Railo</h1>
  <p>Enter the password to continue.</p>
  <form id="f">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required autofocus>
    <button id="go" type="submit">Unlock</button>
    <div class="err" id="err"></div>
  </form>
</main>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(P.s),iterations:P.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(P.i)},key,b(P.c)));
}
function show(html){document.open();document.write(html);document.close();}
const K="railo-pw",gate=document.getElementById("gate");
(async()=>{
  let saved=null;try{saved=localStorage.getItem(K)}catch(e){}
  if(saved){try{show(await open_(saved));return}catch(e){try{localStorage.removeItem(K)}catch(_){}}}
  gate.classList.add("show");document.getElementById("pw").focus();
})();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const pw=document.getElementById("pw").value,go=document.getElementById("go"),err=document.getElementById("err");
  go.disabled=true;err.textContent="";
  try{const html=await open_(pw);try{localStorage.setItem(K,pw)}catch(_){}show(html)}
  catch(x){err.textContent="Wrong password";go.disabled=false;document.getElementById("pw").select()}
});
})();
</script>
